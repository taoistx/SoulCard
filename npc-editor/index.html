<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPC 剧情编辑器</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <main id="editorApp" class="editor-app is-loading">
      <header class="editor-header">
        <div class="brand"><p>WORLD AUTHORING TOOL</p><h1>NPC 剧情编辑器</h1></div>
        <nav><a href="../map-editor/index.html">地图编辑器</a><a href="../index.html">返回游戏</a></nav>
        <div class="header-actions">
          <button id="newNpcButton" type="button">新建 NPC</button>
          <button id="importButton" type="button">导入 JSON</button>
          <input id="importFile" type="file" accept=".json,application/json" hidden />
          <button id="undoButton" type="button">撤销</button>
          <button id="redoButton" type="button">重做</button>
          <button id="sandboxButton" type="button">状态沙盒</button>
          <button id="validateButton" type="button">检查</button>
          <button id="exportButton" class="primary" type="button">导出当前 NPC</button>
        </div>
        <span id="dirtyState" class="dirty-state">载入中</span>
      </header>

      <div class="editor-layout">
        <aside class="panel navigator-panel">
          <section>
            <p class="panel-kicker">当前 NPC</p>
            <select id="npcSelect" aria-label="选择 NPC"></select>
            <button id="npcSettingsButton" class="wide-button" type="button">NPC 与入口设置</button>
          </section>
          <section class="node-section">
            <div class="panel-heading"><p class="panel-kicker">对话节点</p><button id="addNodeButton" type="button">＋</button></div>
            <div id="nodeList" class="node-list"></div>
          </section>
          <section>
            <p class="panel-kicker">图例</p>
            <p class="help"><i class="entry-dot"></i> 入口节点<br />点击选项端口后，再点击目标节点即可连线。节点可以拖动。</p>
          </section>
        </aside>

        <section class="graph-column">
          <div id="graphViewport" class="graph-viewport">
            <svg id="graphEdges" class="graph-edges" aria-hidden="true"></svg>
            <div id="graphNodes" class="graph-nodes"></div>
          </div>
          <footer class="graph-status"><span id="selectionStatus">NPC 设置</span><span id="feedback" role="status"></span></footer>
        </section>

        <aside class="panel inspector-panel">
          <div class="panel-heading"><p class="panel-kicker">属性</p><span id="inspectorKind"></span></div>
          <div id="inspector" class="inspector"></div>
        </aside>
      </div>
    </main>

    <section id="sandbox" class="sandbox is-hidden" role="dialog" aria-modal="true" aria-labelledby="sandboxTitle">
      <div class="sandbox-card">
        <header><div><p class="panel-kicker">STATE SANDBOX</p><h2 id="sandboxTitle">剧情状态沙盒</h2></div><button id="closeSandboxButton" type="button">关闭</button></header>
        <div class="sandbox-layout">
          <aside class="sandbox-state">
            <label>天数<input id="sandboxDay" type="number" min="1" max="5" value="1" /></label>
            <label>Flags（JSON 对象）<textarea id="sandboxFlags" rows="7">{}</textarea></label>
            <label>物品（JSON 对象）<textarea id="sandboxItems" rows="7">{ "healingPotion": 1 }</textarea></label>
            <fieldset id="sandboxSacrifices"><legend>已献祭部位</legend></fieldset>
            <button id="startSandboxButton" class="primary" type="button">从入口开始</button>
          </aside>
          <article class="sandbox-preview">
            <p id="previewKicker" class="preview-kicker">等待开始</p>
            <h3 id="previewTitle">—</h3>
            <p id="previewBody" class="preview-body"></p>
            <div id="previewOptions" class="preview-options"></div>
          </article>
          <aside><p class="panel-kicker">状态变化</p><pre id="sandboxLog" class="sandbox-log">尚未执行剧情。</pre></aside>
        </div>
      </div>
    </section>

    <datalist id="itemIds"></datalist>
    <datalist id="actionIds"></datalist>
    <script src="../world-map.js"></script>
    <script src="../npc-dialogues.js?v=json-dialogue-2"></script>
    <script src="../npc-dialogue-loader.js?v=json-dialogue-2"></script>
    <script src="editor.js?v=json-dialogue-2"></script>
  </body>
</html>
